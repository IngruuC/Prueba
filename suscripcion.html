<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Suscripción</title>
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="style.css">  
</head>
<body>
    <section class="subscription-form">
        <h2 id="hola-titulo" style="color:#010100;">HOLA</h2>
        <!-- Imagen de La Capital -->
        <div style="text-align:center;">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5l8GnsIj4WG0Bar2vDfcROnW-9mgrJ4bb9Q&s" alt="La Capital" style="max-width:250px;height:auto;">
        </div>
        <p>
            Suscríbete a nuestro boletín para recibir alertas de auroras boreales y las últimas noticias sobre clima espacial.
        </p>
        
        
        <form id="form-suscripcion" autocomplete="off">
            <div class="form-row">
                <div class="form-column">
                    <div class="form-group">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                        <span class="input-icon" id="icon-nombre"></span>
                        <div class="error" id="error-nombre"></div>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
                        <span class="input-icon" id="icon-email"></span>
                        <div class="error" id="error-email"></div>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" placeholder="Contraseña" required>
                        <span class="input-icon" id="icon-password"></span>
                        <div class="error" id="error-password"></div>
                    </div>
                    <div class="form-group">
                        <label for="repetir-password">Repetir contraseña:</label>
                        <input type="password" id="repetir-password" name="repetir-password" placeholder="Repite tu contraseña" required>
                        <span class="input-icon" id="icon-repetir-password"></span>
                        <div class="error" id="error-repetir-password"></div>
                    </div>
                    <div class="form-group">
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad" min="0" required>
                        <span class="input-icon" id="icon-edad"></span>
                        <div class="error" id="error-edad"></div>
                    </div>
                </div>
                <div class="form-column">
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" id="telefono" name="telefono" placeholder="Ej: 3411234567" required>
                        <span class="input-icon" id="icon-telefono"></span>
                        <div class="error" id="error-telefono"></div>
                    </div>
                    <div class="form-group">
                        <label for="direccion">Dirección:</label>
                        <input type="text" id="direccion" name="direccion" placeholder="Ej: Calle 123" required>
                        <span class="input-icon" id="icon-direccion"></span>
                        <div class="error" id="error-direccion"></div>
                    </div>
                    <div class="form-group">
                        <label for="ciudad">Ciudad:</label>
                        <input type="text" id="ciudad" name="ciudad" required>
                        <span class="input-icon" id="icon-ciudad"></span>
                        <div class="error" id="error-ciudad"></div>
                    </div>
                    <div class="form-group">
                        <label for="cp">Código Postal:</label>
                        <input type="text" id="cp" name="cp" required>
                        <span class="input-icon" id="icon-cp"></span>
                        <div class="error" id="error-cp"></div>
                    </div>
                    <div class="form-group">
                        <label for="dni">DNI:</label>
                        <input type="text" id="dni" name="dni" required>
                        <span class="input-icon" id="icon-dni"></span>
                        <div class="error" id="error-dni"></div>
                    </div>
                </div>
            </div>
            <div style="text-align:center;margin-top:20px;">
                <button type="submit" id="enviar-btn">Enviar</button>
            </div>
        </form>
        <a href="Noticia.html" class="volver">← Volver a la noticia</a>
    </section>

    <!-- SOLO AGREGAR EL MODAL AL FINAL - SIN TOCAR NADA MÁS -->
    <div id="responseModal" style="display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8);">
        <div style="background-color: #fff; padding: 30px; border-radius: 10px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eee;">
                <h2 id="modalTitle" style="margin: 0; color: #333; font-size: 1.5em;">Resultado</h2>
                <button id="closeModal" style="color: #999; font-size: 28px; font-weight: bold; cursor: pointer; line-height: 1; border: none; background: none; padding: 0;">&times;</button>
            </div>
            <div id="modalBody" style="line-height: 1.6; color: #333;">
            </div>
        </div>
    </div>

<script src="subscription.js"></script>
</body>
</html>
